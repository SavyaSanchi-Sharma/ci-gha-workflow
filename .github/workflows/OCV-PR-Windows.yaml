name: OCV PR Windows

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/OCV-PR-Windows.yaml'
      # TODO: are following paths necessary?
      - 'checkout-and-merge/*'
      - 'configure-and-build/*'
      - 'run-tests/*'
      - 'scripts/runner.py'
      - 'scripts/test-plan.json'
  workflow_dispatch:
  workflow_call:
    inputs:
      workflow_branch:
        description: "Branch for ci-gha-workflow repository"
        default: "main"
        required: false
        type: string

concurrency:
  group: OCV-PR-Windows-${{ github.ref }}
  cancel-in-progress: true

jobs:

  branch_eval:
    runs-on: ubuntu-24.04
    outputs:
      branches: ${{ steps.determine-branches.outputs.branches }}
    steps:
        - id: determine-branches
          shell: bash
          run: |
            if [ "${{ github.event.repository.name == 'ci-gha-workflow' }}" = "true" ] ; then
              echo "branches=[ '4.x' ]" >> "$GITHUB_OUTPUT"
            else
              echo "branches=[ '${{ github.base_ref }}' ]" >> "$GITHUB_OUTPUT"
            fi

  Windows:
    runs-on: ${{ matrix.runner }}
    needs:
      - branch_eval
    strategy:
      # NOTE: Debugging
      # fail-fast: true
      fail-fast: false
      max-parallel: 3
      matrix:
        arch: [ arm64 ]
        config: [ base ]
        include:
          - arch: arm64
            config: base
            runner: windows-11-arm
            vs: 'Visual Studio 17 2022'
            cmake_arch: ARM64
            no_opencl: true

        branch: ${{ fromJSON(needs.branch_eval.outputs.branches )}}
    defaults:
      run:
        shell: bash
    env:
      CMAKE_OPT: >-
        -DCL_Z_OPTION=/Z7
        ${{ matrix.arch == 'arm64' && '-DBUILD_EXAMPLES=OFF' || '-DBUILD_EXAMPLES=ON' }}
        -DOPENCV_ENABLE_NONFREE=ON
        -DCMAKE_BUILD_TYPE=Release
        ${{ matrix.arch == 'arm64' && '-DCMAKE_ASM_COMPILER=CMAKE_ASM_COMPILER-NOTFOUND' || '' }}
        ${{ matrix.no_opencl && '-DWITH_OPENCL=OFF' || '' }}
        ${{ matrix.arch == 'arm64' && '-DBUILD_opencv_python3=OFF' || '' }}
      MAIN_BUILD_DIR: "${{ (github.event.repository.name != 'opencv_contrib') && 'build' || 'build-contrib' }}"
      CMAKE_BUILD_PARALLEL_LEVEL: 8

    # ==========

    steps:

    - name: Runtime fingerprint
      if: ${{ matrix.arch == 'arm64' }}
      shell: pwsh
      run: |
        Get-ChildItem C:\Windows\System32\concrt140.dll,
                      C:\Windows\System32\vcruntime140.dll,
                      C:\Windows\System32\msvcp140.dll -ErrorAction SilentlyContinue |
          ForEach-Object { "{0,-18} {1,-16} {2}" -f $_.Name, $_.VersionInfo.FileVersion, $_.FullName }
        Get-CimInstance Win32_Processor |
          Format-List Name, Description, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed
        "logical processors : $([Environment]::ProcessorCount)"
        "RAM (GB)           : $([math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB,1))"
        "OS                 : $([Environment]::OSVersion.Version)"

    - name: Propagate environment
      run: |
        echo "GIT_CACHE=$(cygpath -u "$GIT_CACHE")" >> "$GITHUB_ENV"
        echo "DNN_MODELS=$(cygpath -u "$DNN_MODELS")" >> "$GITHUB_ENV"
        echo "BINARIES_CACHE=$(cygpath -u "$BINARIES_CACHE")" >> "$GITHUB_ENV"
        echo "OPENCV_DOWNLOAD_PATH=$(cygpath -u "$BINARIES_CACHE")" >> "$GITHUB_ENV"


    - name: Checkout workflow repository
      uses: actions/checkout@v4
      with:
        repository: opencv/ci-gha-workflow
        ref: "${{ github.repository == 'opencv/ci-gha-workflow' && github.ref || inputs.workflow_branch }}"

    - working-directory: '${{ github.workspace }}'
      shell: bash
      run: |
        ls -l
        export
        whoami
        id
        which bash
        echo "GIT_CACHE=$GIT_CACHE"
        echo "DNN_MODELS=$DNN_MODELS"
        echo "BINARIES_CACHE=$BINARIES_CACHE"
        echo "OPENCV_DOWNLOAD_PATH=$BINARIES_CACHE"


    - name: Checkout and merge OpenCV
      uses: ./checkout-and-merge
      with:
        target_branch: '${{ matrix.branch }}'
        author: '${{ github.event.pull_request.user.login }}'
        source_branch: "${{ github.event.repository.name == 'ci-gha-workflow' && '' || github.head_ref }}"
        gitcache: '${{ env.GIT_CACHE }}'
        workdir: '${{ github.workspace }}'

    - name: Update extra dnn models
      if: ${{ matrix.arch != 'arm64' }}
      timeout-minutes: 60
      working-directory: '${{ github.workspace }}'
      run: |
        python opencv_extra/testdata/dnn/download_models.py \
          --cleanup \
          --dst '${{ env.DNN_MODELS }}/dnn'
        echo "OPENCV_DNN_TEST_DATA_PATH=${{ env.DNN_MODELS }}" >> $GITHUB_ENV

    - if: ${{ github.event.repository.name != 'opencv_contrib' }}
      name: Configure and build OpenCV
      uses: ./configure-and-build
      with:
        workdir: '${{ github.workspace }}'
        builddir: 'build'
        generator: '${{ matrix.vs }}'
        options: '-A ${{ matrix.cmake_arch }} ${{ env.CMAKE_OPT }}'

    - if: ${{ matrix.arch != 'arm64' || github.event.repository.name == 'opencv_contrib' }}
      name: Configure and build OpenCV with contrib
      uses: ./configure-and-build
      with:
        workdir: '${{ github.workspace }}'
        builddir: 'build-contrib'
        generator: '${{ matrix.vs }}'
        options: '-A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release -DOPENCV_EXTRA_MODULES_PATH=opencv_contrib/modules ${{ env.CMAKE_OPT }}'

    - name: Thread sweep on the confirmed failures
      if: ${{ matrix.arch == 'arm64' }}
      shell: pwsh
      working-directory: '${{ github.workspace }}'
      env:
        OPENCV_TEST_DATA_PATH: '${{ github.workspace }}/opencv_extra/testdata'
        OPENCV_TEST_REQUIRE_DATA: '0'
        OPENCV_TEST_CHECK_OPTIONAL_DATA: '0'
        OPENCV_OPENCL_RUNTIME: 'disabled'
      run: |
        $filter = '*ColorYUV*:*RemapRelative*:*TRUContours*:*Calib3d_Undistort*:*Calib3d_InitUndistort*:*ML_ANN*'
        $exes = @(
          "build\bin\Release\opencv_test_imgproc.exe",
          "build\bin\Release\opencv_test_calib3d.exe",
          "build\bin\Release\opencv_test_ml.exe"
        )
        $summary = @()
        foreach ($n in 1,2,3,4,8) {
          $env:OPENCV_FOR_THREADS_NUM = $n
          foreach ($exe in $exes) {
            if (-not (Test-Path $exe)) { continue }
            $name = [IO.Path]::GetFileNameWithoutExtension($exe)
            $log  = "sweep-$name-t$n.log"
            Write-Host "::group::threads=$n $name"
            & $exe "--gtest_filter=$filter" *>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            $failed = (Select-String -Path $log -Pattern '^\[  FAILED  \] ' -ErrorAction SilentlyContinue).Count
            $summary += [pscustomobject]@{ threads = $n; binary = $name; exit = $code; failed_lines = $failed }
          }
        }
        Remove-Item Env:\OPENCV_FOR_THREADS_NUM -ErrorAction SilentlyContinue
        Write-Host ""
        Write-Host "================ SWEEP SUMMARY ================"
        $summary | Format-Table -AutoSize | Out-String -Width 200 | Write-Host

    - name: Upload sweep logs
      if: ${{ always() && matrix.arch == 'arm64' }}
      uses: actions/upload-artifact@v4
      with:
        name: sweep-logs-${{ matrix.branch }}
        path: '${{ github.workspace }}/sweep-*.log'
        if-no-files-found: warn

    - if: ${{ always() && env.WARNINGS == '1' }}
      name: Warnings check
      run: |
        echo "::error Warnings have been found!"
        exit 1
